services:
  lmdis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "3000:3000"
    environment:
      LMDIS_REST_TOKEN: ${LMDIS_REST_TOKEN:?set LMDIS_REST_TOKEN}
      LMDB_PATH: /app/data/lmdb
    volumes:
      - lmdis-data:/app/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    environment:
      LMDIS_REST_TOKEN: ${LMDIS_REST_TOKEN:?set LMDIS_REST_TOKEN}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$$LMDIS_REST_TOKEN" > /tmp/lmdis-token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  lmdis-data:
